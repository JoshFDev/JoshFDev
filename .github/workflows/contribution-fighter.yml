name: Contribution-Fighter

on:
  schedule:
    - cron: "30 6 * * *" # una vez al día
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar SVG
        env:
          GH_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUTPUT: assets/contribution-fighter.svg
        run: python3 .github/scripts/generate_ship.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-fighter.svg
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: update contribution fighter"
            git pull --rebase origin main
            git push origin main
          fi
